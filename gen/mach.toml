[project]
id = "gen"
version = "0.1.0"
mach = "^6.10"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
abi = "aapcs64"

# the table generator, which reads only the sources under vendor and writes mink's generated tables
[artifact.gen]
kind = "bin"
default = true
entry = "bin/gen.mach"
out = "{project.work}/bin/gen{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.json]
git = "https://github.com/briar-systems/mach-json"
ref = "branch/dev"

[dep.mink]
path = ".."
