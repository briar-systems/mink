[project]
id = "mink"
version = "0.1.0"
mach = "^6.10"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# the library, what a dependent's `use mink;` binds
[artifact.mink]
kind = "static"
default = true
export = true
entry = "lib/mink.mach"
out = "{project.work}/lib/mink"
targets = ["*"]
link = ["kernel32"]
need = []

# the command line over the library
[artifact.cli]
kind = "bin"
entry = "bin/mink.mach"
out = "{project.work}/bin/mink{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# the child of the hostile input lane, run by test/run.sh --fuzz
[artifact.fuzz]
kind = "bin"
entry = "bin/fuzz.mach"
out = "{project.work}/bin/fuzz{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# the oracle lane of the PE/COFF dump, run by tools/coff/readobj.sh
[artifact.coffdump]
kind = "bin"
entry = "bin/coffdump.mach"
out = "{project.work}/bin/coffdump{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# the oracle lane of the link-edit codecs, run by tools/macho/linkedit.sh
[artifact.linkedit]
kind = "bin"
entry = "bin/linkedit.mach"
out = "{project.work}/bin/linkedit{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"
skip = ["vectorize"]

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
