name: CI

# during the v7 transition every pull request builds on the linux leg only, with
# no tests (#404). the verification phase (#405) restores the full gate: each
# [target.*] in mach.toml, one leg per target, built and tested where its runner
# can run it. a dispatch can name a lane to run the images mink links on the
# native runners of their hosts.

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      runners:
        description: runners to test on, as a JSON array, e.g. ["macos-15", "windows-latest"]
        type: string
      lane:
        description: lane to run beside the pull request jobs
        type: choice
        default: none
        options: [none, all, windows, darwin]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MACH_REF: 3971bd51733236b21f54e3e9f0344120d5333222

jobs:
  # the [target.*] names in mach.toml, as the JSON array the test matrix reads
  targets:
    name: targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          names=$(sed -n 's/^\[target\.\([^].]*\)\][[:space:]]*$/\1/p' mach.toml)
          if [ -z "$names" ]; then echo "mach.toml has no [target.*]" >&2; exit 1; fi
          list=$(printf '%s\n' "$names" | sed 's/.*/"&"/' | paste -sd, -)
          echo "list=[$list]" >> "$GITHUB_OUTPUT"

  # each leg builds every artifact for one target and tests it where the runner can run it
  test:
    name: test (${{ matrix.runner }}, ${{ matrix.target }})
    needs: [targets]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest"]') }}
        target: [linux-x86_64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # until a 7.x release exists, mink is built with the compiler built from the
      # mach commit pinned in MACH_REF. mach's own bootstrap walks the seed chain
      # its ci tests, so mach owns seeding. MACH_REF is bumped on purpose in its
      # own pr.
      - &mach-cache
        id: mach
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ runner.arch }}-${{ env.MACH_REF }}
      - &mach-build
        name: build mach at MACH_REF
        if: steps.mach.outputs.cache-hit != 'true'
        run: |
          exe=
          [ "$RUNNER_OS" = Windows ] && exe=.exe
          git init --quiet "$RUNNER_TEMP/mach-src"
          git -C "$RUNNER_TEMP/mach-src" remote add origin https://github.com/briar-systems/mach
          git -C "$RUNNER_TEMP/mach-src" fetch --quiet --depth 1 origin "$MACH_REF"
          git -C "$RUNNER_TEMP/mach-src" checkout --quiet FETCH_HEAD
          (cd "$RUNNER_TEMP/mach-src" && bash .github/scripts/bootstrap.sh)
          mkdir -p "$RUNNER_TEMP/mach"
          cp "$(sed -n 's/^MACH=//p' "$GITHUB_ENV" | tail -n 1)" "$RUNNER_TEMP/mach/mach$exe"
      - &mach-path
        name: add mach to PATH
        run: echo "$RUNNER_TEMP/mach" >> "$GITHUB_PATH"
      - run: mach dep pull .
      - if: strategy.job-index == 0
        run: mach fmt --check .
      - if: strategy.job-index == 0
        run: mach fmt --check gen
      - run: mach build . --all -t ${{ matrix.target }}

  # mink links every case of test/image/cases.tsv for the hosts of the lane on
  # linux, and the native runner of each host runs them
  images:
    name: images
    if: contains(fromJSON('["all", "windows", "darwin"]'), inputs.lane)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - *mach-cache
      - *mach-build
      - *mach-path
      - run: mach dep pull .
      - run: mach build . -a cli -t linux-x86_64
      - run: bash test/image.sh link "${{ inputs.lane }}" out/image
      - uses: actions/upload-artifact@v6
        with:
          name: images
          path: out/image
          if-no-files-found: error

  run-windows:
    name: run windows-x86_64
    needs: [images]
    if: contains(fromJSON('["all", "windows"]'), inputs.lane)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: images
          path: out/image
      - run: bash test/image.sh run windows-x86_64 out/image

  run-darwin:
    name: run ${{ matrix.host }}
    needs: [images]
    if: contains(fromJSON('["all", "darwin"]'), inputs.lane)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: darwin-aarch64, runs-on: macos-15 }
          - { host: darwin-x86_64,  runs-on: macos-15-intel }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: images
          path: out/image
      - run: bash test/image.sh run ${{ matrix.host }} out/image

  gate:
    if: always()
    needs: [targets, test, images, run-windows, run-darwin]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
