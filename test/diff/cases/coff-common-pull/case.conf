build: clang --target=x86_64-pc-windows-msvc -fcommon -c {in}/main.c -o {out}/main.obj
build: clang --target=x86_64-pc-windows-msvc -c {in}/member.c -o {out}/member.obj
build: llvm-lib /out:{out}/lib.lib {out}/member.obj
inputs: main.obj lib.lib
system: lld-link /nologo /entry:main /subsystem:console /nodefaultlib /out:{image} {inputs}
mink: --kind static --format coff --arch x86_64 --system windows --env msvc
observe: bytes TRKM
