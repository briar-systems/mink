build: clang --target=x86_64-apple-macos11 -fcommon -fno-unwind-tables -fno-asynchronous-unwind-tables -c {in}/main.c -o {out}/main.o
build: clang --target=x86_64-apple-macos11 -fno-unwind-tables -fno-asynchronous-unwind-tables -c {in}/member.c -o {out}/member.o
build: llvm-ar rcs {out}/lib.a {out}/member.o
inputs: main.o lib.a
system: ld64.lld -arch x86_64 -platform_version macos 11.0 11.0 -static -e _main -o {image} {inputs}
mink: --kind static --format macho --arch x86_64 --system darwin --env macos --system-version 11.0 --entry _main
observe: bytes TRKM
