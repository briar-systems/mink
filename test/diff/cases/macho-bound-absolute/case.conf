build: llvm-mc -triple=x86_64-apple-macos11 -filetype=obj {in}/main.s -o {out}/main.o
copy: libdep.tbd
inputs: main.o libdep.tbd
system: ld64.lld -arch x86_64 -platform_version macos 11.0 11.0 -e _main -o {image} {inputs}
mink: --kind dynamic --format macho --arch x86_64 --system darwin --env macos --system-version 11.0
observe: status
