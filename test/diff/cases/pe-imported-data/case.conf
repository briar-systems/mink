build: clang --target=x86_64-pc-windows-msvc -c {in}/main.c -o {out}/main.obj
build: llvm-dlltool -m i386:x86-64 -d {in}/dep.def -l {out}/dep.lib
inputs: main.obj dep.lib
system: lld-link /nologo /entry:main /subsystem:console /nodefaultlib /out:{image} {inputs}
mink: --kind static --format coff --arch x86_64 --system windows --env msvc
observe: status
