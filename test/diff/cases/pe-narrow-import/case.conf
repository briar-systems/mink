build: llvm-mc -triple=x86_64-pc-windows-msvc -filetype=obj {in}/main.s -o {out}/main.obj
build: llvm-dlltool -m i386:x86-64 -d {in}/dep.def -l {out}/dep.lib
inputs: main.obj dep.lib
system: lld-link /nologo /entry:main /subsystem:console /nodefaultlib /largeaddressaware:no /out:{image} {inputs}
mink: --kind static --format coff --arch x86_64 --system windows --env msvc
observe: status
