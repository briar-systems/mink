build: as --64 {in}/main.s -o {out}/main.o
build: as --64 {in}/f.s -o {out}/f.o
build: as --64 {in}/g-old.s -o {out}/g-old.o
build: as --64 {in}/g-new.s -o {out}/g-new.o
build: ar rcs {out}/lib.a {out}/f.o {out}/g-old.o {out}/g-new.o
inputs: main.o lib.a
system: ld -m elf_x86_64 -static -e _start -o {image} {inputs}
mink: --kind static --format elf --arch x86_64 --system linux --env gnu
observe: bytes PULLED
